<!DOCTYPE html>
<html lang="en" data-side="pretty">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@700;900&family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600;800&display=swap">
<style>
/* same Pretty (AM) / Killer (PM) tokens as the other Pretty Killer pages */
:root{
  --ground:#f8d2e1; --surface:#fffafc; --ink:#161015; --muted:#8e5a73;
  --accent:#f25fc4; --accent-ink:#161015; --line:#e9b1c9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"Special Elite","Courier New",monospace;
  --radius:3px; --shadow:0 18px 28px -14px rgba(120,30,75,.45);
  color-scheme:light;
}
:root[data-side="killer"]{
  --ground:#09080a; --surface:#141216; --ink:#f2ecf0; --muted:#8c8390;
  --accent:#ff3fae; --accent-ink:#0a0a0a; --line:#2c272f;
  --display:"Anton","Impact",sans-serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:0px; --shadow:6px 6px 0 0 #ff3fae;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.bar a{color:var(--ink);text-decoration:none;font:900 20px/1 var(--display)}
[data-side="killer"] .bar a{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.bar span{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.eyebrow{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
h1{margin:6px 0 4px;font:900 clamp(38px,10vw,72px)/.95 var(--display)}
[data-side="killer"] h1{font-weight:400;text-transform:uppercase;color:var(--accent)}

.hud{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font:600 13px var(--mono);color:var(--muted)}
.hud .track{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hud .track i{display:block;height:100%;background:var(--accent);transition:width .5s}
.hud b{color:var(--accent)}
.scene{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#2a2226}
.scene svg{display:block;width:100%;height:100%}
.scene.walk svg{animation:walk .6s ease-in forwards}
@keyframes walk{to{transform:scale(1.35);opacity:0}}
.scene.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.you{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:600 12px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;background:#f25fc4;color:#161015;padding:4px 10px;border-radius:999px;pointer-events:none}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.card h2{margin:0 0 6px;font:900 26px/1.1 var(--display)}
[data-side="killer"] .card h2{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.card p{margin:0}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--body);text-align:left;cursor:pointer;border-radius:var(--radius)}
.choice .ic{font-size:22px;width:28px;text-align:center}
.choice:hover{border-color:var(--accent)}
.choice.no{border-color:#c0392b;opacity:.6}
.msg{margin-top:10px;font:600 14px var(--mono);color:var(--accent);min-height:1.4em}
.find{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.find span{font:600 13px var(--mono);padding:8px 12px;border:1.5px solid var(--line);border-radius:999px}
.find span.got{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.find span.now{border-color:var(--accent);color:var(--accent)}
.spot{cursor:pointer}
.spot:focus-visible{outline:3px solid #f25fc4}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);text-decoration:none;border:0;font:600 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-radius:var(--radius)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.steps{margin:12px 0 0;padding-left:20px}
.steps li{margin:4px 0}
@media (prefers-reduced-motion:reduce){.scene.walk svg,.scene.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><a href="https://qwerty-ally.github.io/pretty-killer-hub/">Finn Shapiro</a><span>Pretty Killer Tour</span></header>
  <span class="eyebrow">Tour simulator · 15 Freeman Parkway</span>
  <h1>Find your way to the show</h1>

  <div class="hud"><span id="stepNo"></span><span class="track"><i id="fill"></i></span><span>Score <b id="score">0</b></span></div>
  <div class="scene" id="scene"></div>
  <section class="card" id="card"></section>
</div>

<script>
/* =====================================================================
   THE ROUTE, from the front door to the show room. Each step has a drawn
   scene, what to do, and choices (one is right). The last step is the
   show room map: tap the merch table, the stage and the front seating.
   ===================================================================== */
const STEPS = [
  { scene:"hall", title:"You're inside!", text:"Welcome to 15 Freeman Parkway. The show is downstairs.",
    choices:[ { ic:"⬆️", t:"Go up the stairs", no:"Not tonight! The show is downstairs." },
              { ic:"➡️", t:"Walk down the hallway", ok:true },
              { ic:"↩️", t:"Go back outside", no:"You just got here! Keep going." } ] },
  { scene:"door", title:"The door at the end of the hall", text:"This door leads to the stairs.",
    choices:[ { ic:"🚪", t:"Open the door", ok:true },
              { ic:"🛋️", t:"Sit down and wait", no:"The show won't come to you! Open the door." } ] },
  { scene:"stairs", title:"Down the stairs", text:"Hold the railing. The stairs turn at the bottom.",
    choices:[ { ic:"⬇️", t:"Go down the stairs", ok:true },
              { ic:"⬆️", t:"Go back up", no:"Wrong way! The show is down there." } ] },
  { scene:"tiles", title:"The bottom of the stairs", text:"You're on the red tiles. The show room is through the wooden door.",
    choices:[ { ic:"🎒", t:"Look around the storage", no:"Nothing to see there. Find the wooden door!" },
              { ic:"🚪", t:"Go through the wooden door", ok:true } ] },
  { scene:"room", title:"You made it to the show room!", text:"Now find everything. Tap each spot on the map.",
    find:[ { id:"merch", t:"Merch table", say:"The merch table is by the fireplace. Pick up your order here." },
           { id:"stage", t:"Stage", say:"The stage is marked with blue tape on the floor. Don't step on it!" },
           { id:"seats", t:"Front seating", say:"Front seating is the red bean bag in front of the fireplace." } ] }
];

const $ = s => document.querySelector(s);
let step = 0, score = 0, found = [], wrongThisStep = false;
document.documentElement.dataset.side = new Date().getHours() < 12 ? "pretty" : "killer";

/* ---------- scenes (drawn, no photos) ---------- */
const SCENES = {
  // hallway: stairs going up on the left, door at the end
  hall: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Front hallway with stairs going up on the left and a door at the end">
    <rect width="400" height="300" fill="#efe6cf"/>
    ${Array.from({ length: 26 }, (_, i) => `<rect x="${i * 16}" y="0" width="6" height="170" fill="#e2d6b4"/>`).join("")}
    <polygon points="0,300 400,300 260,190 140,190" fill="#5a3522"/>
    <polygon points="140,190 260,190 260,60 140,60" fill="#d9ccaa"/>
    <rect x="170" y="80" width="60" height="110" fill="#f7f4ec" stroke="#cfc6b0"/>
    ${[0,1,2].map(r => [0,1].map(c => `<rect x="${176 + c * 25}" y="${86 + r * 18}" width="21" height="14" fill="#2b3340"/>`).join("")).join("")}
    <rect x="186" y="150" width="28" height="6" fill="#8a6a3a"/>
    <polygon points="0,90 140,150 140,200 0,300" fill="#f7f4ec"/>
    ${Array.from({ length: 7 }, (_, i) => `<polygon points="${i * 20},${300 - i * 30} ${140},${200 - i * 7} ${140},${196 - i * 7} ${i * 20},${290 - i * 30}" fill="#5a3522"/>`).join("")}
    <line x1="10" y1="120" x2="140" y2="165" stroke="#3a2416" stroke-width="5"/>
    <polygon points="400,90 260,150 260,200 400,300" fill="#f7f4ec"/>
    <rect x="300" y="160" width="70" height="40" fill="#fff" stroke="#ddd"/>
    <path d="M200 270 l0 -40 m-14 14 l14 -14 l14 14" stroke="#f25fc4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`,
  // the door with window panes
  door: () => `<svg viewBox="0 0 400 300" role="img" aria-label="A white door with window panes">
    <rect width="400" height="300" fill="#e9dfc6"/>
    <rect x="0" y="230" width="400" height="70" fill="#5a3522"/>
    <rect x="120" y="20" width="160" height="250" fill="#f7f4ec" stroke="#cfc6b0" stroke-width="4"/>
    ${[0,1].map(r => [0,1,2].map(c => `<rect x="${134 + c * 46}" y="${34 + r * 46}" width="40" height="40" fill="#2b3340"/>`).join("")).join("")}
    <rect x="160" y="150" width="80" height="14" fill="#9b7b3a"/>
    <rect x="140" y="180" width="120" height="76" fill="none" stroke="#e0d8c4" stroke-width="3"/>
    <circle cx="262" cy="150" r="7" fill="#b08a3e"/>
    <path d="M300 150 h50 m-14 -14 l14 14 l-14 14" stroke="#f25fc4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`,
  // carpeted stairs going down, turning at the bottom
  stairs: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Carpeted stairs going down with a railing, turning at the bottom">
    <rect width="400" height="300" fill="#efe3c4"/>
    <polygon points="90,0 310,0 260,300 140,300" fill="#e6d8b0"/>
    ${Array.from({ length: 9 }, (_, i) => { const y = 300 - i * 30, w = 120 + i * 5;
      return `<rect x="${200 - w / 2 - i * 6}" y="${y - 22}" width="${w}" height="22" fill="${i % 2 ? "#cdbfa3" : "#d8cbb0"}" stroke="#a8977a"/>`; }).join("")}
    <polygon points="60,40 150,40 180,300 60,300" fill="#4a2b1a" opacity=".85"/>
    ${Array.from({ length: 8 }, (_, i) => `<rect x="${78 + i * 12}" y="${90 + i * 22}" width="5" height="80" fill="#3a2114"/>`).join("")}
    <line x1="60" y1="80" x2="180" y2="260" stroke="#3a2114" stroke-width="8"/>
    <line x1="350" y1="60" x2="250" y2="250" stroke="#6b3d22" stroke-width="7"/>
    <path d="M200 40 v60 m-16 -16 l16 16 l16 -16" stroke="#f25fc4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`,
  // red tile landing and the wooden door
  tiles: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Red tile floor at the bottom of the stairs, and a wooden door">
    <rect width="400" height="300" fill="#e8dcbf"/>
    <rect x="0" y="150" width="400" height="150" fill="#8a6a45"/>
    <polygon points="40,300 300,300 270,170 70,170" fill="#a6402e"/>
    ${Array.from({ length: 6 }, (_, r) => Array.from({ length: 9 }, (_, c) => { const y = 170 + r * 22, x0 = 70 - r * 5, w = (200 + r * 10) / 9;
      return `<rect x="${x0 + c * w}" y="${y}" width="${w - 2}" height="20" fill="#b2492f"/>`; }).join("")).join("")}
    <rect x="300" y="40" width="80" height="200" fill="#6b3418"/>
    <path d="M310 60 q30 40 0 90 q30 30 0 70" stroke="#4e2410" stroke-width="5" fill="none"/>
    <circle cx="368" cy="140" r="6" fill="#c9a24a"/>
    <rect x="20" y="110" width="50" height="45" fill="#2b2b33"/><rect x="30" y="95" width="30" height="20" fill="#e85f9c"/>
    <path d="M250 120 h40 m-14 -14 l14 14 l-14 14" stroke="#f25fc4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`,
  // the show room, from above
  room: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Map of the show room from above">
    <rect width="400" height="300" fill="#8a6a45"/>
    <rect x="0" y="0" width="400" height="34" fill="#e8dcbf"/>
    <rect x="70" y="0" width="70" height="40" fill="#1f8a4c"/><text x="105" y="24" text-anchor="middle" style="font:600 9px 'IBM Plex Mono',monospace" fill="#fff">GREEN SCREEN</text>
    <rect x="170" y="0" width="80" height="44" fill="#f7f4ec" stroke="#cfc6b0"/><rect x="190" y="10" width="40" height="30" fill="#2b2222"/>
    <text x="210" y="56" text-anchor="middle" style="font:600 9px 'IBM Plex Mono',monospace" fill="#f2e6cc">FIREPLACE</text>
    <rect x="300" y="0" width="100" height="26" fill="#d9c9a3"/><text x="350" y="17" text-anchor="middle" style="font:600 9px 'IBM Plex Mono',monospace" fill="#5a4630">SHELVES</text>
    <g class="spot" data-spot="merch" tabindex="0" role="button" aria-label="Merch table">
      <rect x="100" y="60" width="74" height="40" rx="3" fill="#f4f4f4" stroke="#bbb" stroke-width="2"/>
      <circle cx="160" cy="76" r="9" fill="#f07c1f"/><text x="137" y="94" text-anchor="middle" style="font:600 9px 'IBM Plex Mono',monospace" fill="#333">TABLE</text>
    </g>
    <g class="spot" data-spot="seats" tabindex="0" role="button" aria-label="Front seating">
      <rect x="196" y="70" width="70" height="34" rx="16" fill="#c8243e"/><text x="231" y="91" text-anchor="middle" style="font:600 9px 'IBM Plex Mono',monospace" fill="#fff">BEAN BAG</text>
    </g>
    <g class="spot" data-spot="stage" tabindex="0" role="button" aria-label="Stage">
      <rect x="180" y="140" width="170" height="110" fill="rgba(255,255,255,.06)" stroke="#2f5fd0" stroke-width="5" stroke-dasharray="14 6"/>
      <text x="265" y="200" text-anchor="middle" style="font:400 20px 'Anton',sans-serif;letter-spacing:.06em" fill="rgba(255,255,255,.35)">BLUE TAPE</text>
    </g>
    <rect x="0" y="260" width="60" height="40" fill="#6b3418"/><text x="30" y="284" text-anchor="middle" style="font:600 9px 'IBM Plex Mono',monospace" fill="#f2e6cc">DOOR IN</text>
    <g id="marks"></g>
  </svg>`
};

/* ---------- game ---------- */
function hud(){
  $("#stepNo").textContent = step < STEPS.length ? `Step ${step + 1} of ${STEPS.length}` : "Done!";
  $("#fill").style.width = `${Math.min(step, STEPS.length) / STEPS.length * 100}%`;
  $("#score").textContent = score;
}
function show(){
  hud();
  if (step >= STEPS.length) return finish();
  const s = STEPS[step]; wrongThisStep = false;
  $("#scene").className = "scene";
  $("#scene").innerHTML = SCENES[s.scene]() + (s.find ? "" : `<span class="you">You</span>`);
  if (s.find){ found = []; renderFind(); return; }
  $("#card").innerHTML = `<h2>${s.title}</h2><p>${s.text}</p>
    <div class="choices">${s.choices.map((c, i) => `<button class="choice" type="button" data-c="${i}"><span class="ic" aria-hidden="true">${c.ic}</span>${c.t}</button>`).join("")}</div>
    <p class="msg" id="msg" aria-live="polite"></p>`;
}
function choose(i, btn){
  const c = STEPS[step].choices[i];
  if (!c.ok){
    wrongThisStep = true; btn.classList.add("no"); btn.disabled = true;
    $("#msg").textContent = c.no;
    const sc = $("#scene"); sc.classList.remove("shake"); void sc.offsetWidth; sc.classList.add("shake");
    return;
  }
  score += wrongThisStep ? 50 : 100;
  document.querySelectorAll(".choice").forEach(b => b.disabled = true);
  $("#scene").classList.add("walk");
  setTimeout(() => { step++; show(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 600);
}
function renderFind(){
  const s = STEPS[step], next = s.find.find(f => !found.includes(f.id));
  $("#card").innerHTML = `<h2>${s.title}</h2><p>${next ? `Tap the <b>${next.t.toLowerCase()}</b> on the map.` : "You found everything!"}</p>
    <div class="find">${s.find.map(f => `<span class="${found.includes(f.id) ? "got" : f === next ? "now" : ""}">${found.includes(f.id) ? "✓ " : ""}${f.t}</span>`).join("")}</div>
    <p class="msg" id="msg" aria-live="polite"></p>
    ${next ? "" : `<div class="btns"><button class="btn" type="button" id="done">Finish</button></div>`}`;
  const marks = document.querySelector("#marks");
  if (marks) marks.innerHTML = found.map(id => { const g = document.querySelector(`[data-spot="${id}"]`).getBBox();
    return `<circle cx="${g.x + g.width / 2}" cy="${g.y + g.height / 2}" r="${Math.max(g.width, g.height) / 2 + 8}" fill="none" stroke="#f25fc4" stroke-width="4"/>`; }).join("");
}
function tapSpot(id){
  const s = STEPS[step], next = s.find.find(f => !found.includes(f.id));
  if (!next) return;
  if (id !== next.id){ $("#msg").textContent = found.includes(id) ? "You already found that one!" : `That's the ${s.find.find(f => f.id === id).t.toLowerCase()}. Find the ${next.t.toLowerCase()}!`; return; }
  found.push(id); score += 100; hud(); renderFind(); $("#msg").textContent = next.say;
}
function finish(){
  hud();
  const max = (STEPS.length - 1) * 100 + STEPS[STEPS.length - 1].find.length * 100;
  $("#scene").className = "scene";
  $("#scene").innerHTML = SCENES.room() ;
  $("#card").innerHTML = `<h2>You're ready for the show! 🎉</h2><p>Score <b>${score}</b> of ${max}${score === max ? ". Perfect! You know the way." : "."}</p>
    <ol class="steps">
      <li>Walk down the front hallway, past the stairs going up.</li>
      <li>Go through the door at the end of the hall.</li>
      <li>Go down the stairs (they turn at the bottom).</li>
      <li>Cross the red tiles and go through the wooden door.</li>
      <li>Merch table by the fireplace · stage marked with blue tape · front seating on the red bean bag.</li>
    </ol>
    <div class="btns"><button class="btn" type="button" id="again">Play again</button><a class="btn ghost" href="./#mine">My tickets</a><a class="btn ghost" href="info.html">Show day info</a></div>`;
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (c) return choose(+c.dataset.c, c);
  const sp = e.target.closest("[data-spot]"); if (sp) return tapSpot(sp.dataset.spot);
  if (e.target.closest("#done")){ step++; show(); }
  if (e.target.closest("#again")){ step = 0; score = 0; show(); }
});
document.addEventListener("keydown", e => { const sp = e.target.closest && e.target.closest("[data-spot]"); if (sp && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tapSpot(sp.dataset.spot); } });
show();
</script>
</body>
</html>
