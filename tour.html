<!DOCTYPE html>
<html lang="en" data-side="pretty">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@700;900&family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600;800&display=swap">
<style>
/* same Pretty (AM) / Killer (PM) tokens as the other Pretty Killer pages */
:root{
  --ground:#f8d2e1; --surface:#fffafc; --ink:#161015; --muted:#8e5a73;
  --accent:#f25fc4; --accent-ink:#161015; --line:#e9b1c9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"Special Elite","Courier New",monospace;
  --radius:3px; --shadow:0 18px 28px -14px rgba(120,30,75,.45);
  color-scheme:light;
}
:root[data-side="killer"]{
  --ground:#09080a; --surface:#141216; --ink:#f2ecf0; --muted:#8c8390;
  --accent:#ff3fae; --accent-ink:#0a0a0a; --line:#2c272f;
  --display:"Anton","Impact",sans-serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:0px; --shadow:6px 6px 0 0 #ff3fae;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.bar a{color:var(--ink);text-decoration:none;font:900 20px/1 var(--display)}
[data-side="killer"] .bar a{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.bar span{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.eyebrow{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
h1{margin:6px 0 4px;font:900 clamp(38px,10vw,72px)/.95 var(--display)}
[data-side="killer"] h1{font-weight:400;text-transform:uppercase;color:var(--accent)}

.hud{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font:600 13px var(--mono);color:var(--muted)}
.hud .track{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hud .track i{display:block;height:100%;background:var(--accent);transition:width .5s}
.hud b{color:var(--accent)}
.scene{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#2a2226}
.scene svg{display:block;width:100%;height:100%}
.scene.walk svg{animation:walk .6s ease-in forwards}
@keyframes walk{to{transform:scale(1.35);opacity:0}}
.scene.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.you{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:600 12px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;background:#f25fc4;color:#161015;padding:4px 10px;border-radius:999px;pointer-events:none}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.card h2{margin:0 0 6px;font:900 26px/1.1 var(--display)}
[data-side="killer"] .card h2{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.card p{margin:0}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--body);text-align:left;cursor:pointer;border-radius:var(--radius)}
.choice .ic{font-size:22px;width:28px;text-align:center}
.choice:hover{border-color:var(--accent)}
.choice.no{border-color:#c0392b;opacity:.6}
.msg{margin-top:10px;font:600 14px var(--mono);color:var(--accent);min-height:1.4em}
.find{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.find span{font:600 13px var(--mono);padding:8px 12px;border:1.5px solid var(--line);border-radius:999px}
.find span.got{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.find span.now{border-color:var(--accent);color:var(--accent)}
.spot{cursor:pointer}
.spot:hover{filter:brightness(1.12)}
.glow-left{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.spot:focus-visible{outline:3px solid #f25fc4}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);text-decoration:none;border:0;font:600 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-radius:var(--radius)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.steps{margin:12px 0 0;padding-left:20px}
.steps li{margin:4px 0}
@media (prefers-reduced-motion:reduce){.scene.walk svg,.scene.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><a href="https://qwerty-ally.github.io/pretty-killer-hub/">Finn Shapiro</a><span>Pretty Killer Tour</span></header>
  <span class="eyebrow">Tour simulator · 15 Freeman Parkway</span>
  <h1>Find your way to the show</h1>

  <div class="hud"><span id="stepNo"></span><span class="track"><i id="fill"></i></span><span>Score <b id="score">0</b></span></div>
  <div class="scene" id="scene"></div>
  <section class="card" id="card"></section>
</div>

<script>
/* =====================================================================
   THE ROUTE, from the front door to the show room. Each step has a drawn
   scene, what to do, and choices (one is right). The last step is the
   show room map: tap the merch table, the stage and the front seating.
   ===================================================================== */
const STEPS = [
  { scene:"hall", title:"You're inside!", text:"Welcome to 15 Freeman Parkway. The show is downstairs. Follow the pink footsteps down the hallway.",
    choices:[ { ic:"⬆️", t:"Go up the stairs", no:"Not tonight! The show is downstairs." },
              { ic:"👣", t:"Walk down the hallway", ok:true },
              { ic:"↩️", t:"Go back outside", no:"You just got here! Keep going." } ] },
  { scene:"door", title:"Find the right door", text:"The door to the stairs is on the left wall of the hallway. The door at the end is the front door.",
    choices:[ { ic:"⬅️", t:"Open the door on the left wall", ok:true },
              { ic:"🚪", t:"Open the door at the end of the hall", no:"That's the front door! You'd be back outside." } ] },
  { scene:"stairs", title:"Down the stairs", text:"Hold the railing. The stairs turn at the bottom.",
    choices:[ { ic:"⬇️", t:"Go down the stairs", ok:true },
              { ic:"⬆️", t:"Go back up", no:"Wrong way! The show is down there." } ] },
  { scene:"tiles", title:"The bottom of the stairs", text:"You're on the red tiles. The show room is right in front of you, no door.",
    choices:[ { ic:"👣", t:"Walk across the tiles into the show room", ok:true },
              { ic:"⬆️", t:"Go back upstairs", no:"You're almost there! Keep going." } ] },
  { scene:"room", title:"You made it to the show room!", text:"Now find everything. Tap each spot on the map.",
    find:[ { id:"merch", t:"Merch table", say:"The merch table is by the fireplace. Pick up your order here." },
           { id:"stage", t:"Stage", say:"The stage is marked with blue tape on the floor. Don't step on it!" },
           { id:"seats", t:"Front seating", say:"Front seating is the red bean bag in front of the fireplace." } ] }
];

const $ = s => document.querySelector(s);
let step = 0, score = 0, found = [], wrongThisStep = false;
document.documentElement.dataset.side = new Date().getHours() < 12 ? "pretty" : "killer";

/* ---------- scenes (drawn, no photos) ---------- */
// shared bits: gradients, pink footsteps and a glowing ring
const DEFS = `<defs>
  <linearGradient id="gFloor" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a2a18"/><stop offset="1" stop-color="#2c170c"/></linearGradient>
  <linearGradient id="gWallL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dcb8"/><stop offset="1" stop-color="#cdbd93"/></linearGradient>
  <linearGradient id="gWallR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#e9dcb8"/><stop offset="1" stop-color="#cdbd93"/></linearGradient>
  <linearGradient id="gCeil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4eedf"/><stop offset="1" stop-color="#d9cfb6"/></linearGradient>
  <linearGradient id="gStep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ccb0"/><stop offset="1" stop-color="#b9a989"/></linearGradient>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#ff3fae" stop-opacity=".55"/><stop offset="1" stop-color="#ff3fae" stop-opacity="0"/></radialGradient>
  <radialGradient id="gLight" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
</defs>`;
const VIG = `<rect width="400" height="300" fill="url(#gVig)" pointer-events="none"/>`;
// footsteps along points [[x,y,size], ...]
const feet = pts => pts.map(([x, y, k], i) => `<g transform="translate(${x} ${y}) scale(${k})" opacity="${.55 + i / pts.length * .45}">
  <ellipse cx="${i % 2 ? 5 : -5}" cy="0" rx="4" ry="7" fill="#ff3fae"/><circle cx="${i % 2 ? 5 : -5}" cy="-9" r="2.4" fill="#ff3fae"/></g>`).join("");
// the hallway in one-point perspective (used for step 1, and zoomed in for step 2)
const HALL = (box, label) => `<svg viewBox="${box}" role="img" aria-label="${label}">${DEFS}
  <polygon points="0,0 400,0 250,90 150,90" fill="url(#gCeil)"/>
  <ellipse cx="200" cy="40" rx="26" ry="7" fill="#fff9e6"/><ellipse cx="200" cy="60" rx="120" ry="60" fill="url(#gLight)"/>
  <polygon points="0,0 150,90 150,190 0,300" fill="url(#gWallL)"/>
  <polygon points="400,0 250,90 250,190 400,300" fill="url(#gWallR)"/>
  ${[20, 45, 70, 95, 120].map(x => `<line x1="${x}" y1="${x * .6}" x2="${x}" y2="${300 - x * .733 - (300 - x * .733 - x * .6) * .45}" stroke="#d8c79b" stroke-width="3"/>`).join("")}
  ${[280, 305, 330, 355, 380].map(x => `<line x1="${x}" y1="${(400 - x) * .6}" x2="${x}" y2="${300 - (400 - x) * .733 - (300 - (400 - x) * .733 - (400 - x) * .6) * .45}" stroke="#d8c79b" stroke-width="3"/>`).join("")}
  <polygon points="0,165 150,152 150,190 0,300" fill="#f6f2e8"/><polygon points="400,165 250,152 250,190 400,300" fill="#f6f2e8"/>
  <line x1="0" y1="165" x2="150" y2="152" stroke="#fff" stroke-width="3"/><line x1="400" y1="165" x2="250" y2="152" stroke="#fff" stroke-width="3"/>
  <rect x="150" y="90" width="100" height="100" fill="#ddd0ad"/>
  <rect x="181" y="112" width="38" height="78" fill="#f7f4ec" stroke="#c9bfa6" stroke-width="2"/>
  ${[0, 1, 2].map(r => [0, 1].map(c => `<rect x="${185 + c * 16}" y="${116 + r * 11}" width="14" height="9" fill="#2b3340"/>`).join("")).join("")}
  <rect x="190" y="152" width="20" height="4" fill="#a8873f"/>
  <polygon points="0,300 400,300 250,190 150,190" fill="url(#gFloor)"/>
  ${[1, 2, 3, 4, 5, 6].map(k => `<line x1="${150 - k * 25}" y1="${190 + k * 18}" x2="${250 + k * 25}" y2="${190 + k * 18}" stroke="#5a3522" stroke-width="1" opacity=".5"/>`).join("")}
  <polygon points="300,262 345,226 345,175 300,196" fill="#fbf8f1" stroke="#e2dccd"/>
  ${[0, 1, 2, 3].map(k => `<line x1="${306 + k * 9}" y1="${203 - k * 6}" x2="${306 + k * 9}" y2="${248 - k * 9}" stroke="#d6cfbe" stroke-width="3"/>`).join("")}
  <polygon points="0,236 46,190 46,200 0,252" fill="#5a3522"/>
  ${[0, 1, 2, 3, 4].map(k => `<polygon points="0,${206 - k * 30} ${46 - k * 2},${160 - k * 26} ${46 - k * 2},${170 - k * 26} 0,${222 - k * 30}" fill="#6b4029"/><rect x="${4 + k * 9}" y="${150 - k * 26}" width="3" height="${48}" fill="#fbf8f1"/>`).join("")}
  <line x1="0" y1="130" x2="50" y2="20" stroke="#3a2114" stroke-width="7" stroke-linecap="round"/>
  <polygon points="70,94 110,104 110,219 70,249" fill="#f7f4ec" stroke="#cdbf9f" stroke-width="2"/>
  <polygon points="76,108 104,115 104,154 76,160" fill="#efe9da" stroke="#d8cdb2"/>
  <polygon points="76,175 104,168 104,205 76,227" fill="#efe9da" stroke="#d8cdb2"/>
  <circle cx="102" cy="165" r="3.5" fill="#b08a3e"/>
  <ellipse cx="90" cy="172" rx="48" ry="78" fill="url(#gGlow)" class="glow-left"/>
  <polygon points="70,94 110,104 110,219 70,249" fill="none" stroke="#ff3fae" stroke-width="3" class="glow-left"/>
  ${VIG}
</svg>`;

const SCENES = {
  // step 1: the front hallway; footsteps lead down the hall toward the door on the left wall
  hall: () => HALL("0 0 400 300", "Front hallway. Stairs go up on the left, the front door is at the end, and a door on the left wall leads downstairs")
    .replace("</svg>", `${feet([[205, 286, 1.2], [195, 266, 1.1], [180, 248, 1], [160, 234, .9], [140, 224, .8], [120, 216, .7]])}</svg>`),
  // step 2: closer to the door on the left wall (glowing), the front door at the end is the wrong way
  door: () => HALL("20 60 240 180", "Close up of the door on the left wall of the hallway, glowing pink. The front door is at the end of the hall")
    .replace("</svg>", `${feet([[150, 232, .9], [132, 226, .8], [118, 220, .7]])}
      <g transform="translate(200 104)"><circle r="9" fill="#161015" opacity=".75"/><path d="M-4 -4 l8 8 m0 -8 l-8 8" stroke="#ff5a5a" stroke-width="2.5" stroke-linecap="round"/></g>
      <g transform="translate(76 78)"><rect x="-4" y="-11" width="70" height="20" rx="10" fill="#ff3fae"/><text x="31" y="3" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace" fill="#161015">THIS DOOR</text><path d="M14 9 l0 9 m-4 -4 l4 4 l4 -4" stroke="#ff3fae" stroke-width="2.5" fill="none"/></g></svg>`),
  // step 3: looking down the carpeted stairs, turning left at the bottom
  stairs: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Looking down carpeted stairs with railings on both sides; they turn left at the bottom">${DEFS}
    <rect width="400" height="300" fill="#e9dcbc"/>
    <polygon points="0,0 120,0 150,300 0,300" fill="url(#gWallL)"/><polygon points="400,0 280,0 250,300 400,300" fill="url(#gWallR)"/>
    ${Array.from({ length: 9 }, (_, k) => { const y0 = 300 - k * 30, y1 = y0 - 30, l0 = 150 - k * 3.3, r0 = 250 + k * 3.3, l1 = l0 - 3.3, r1 = r0 + 3.3;
      return `<polygon points="${l0},${y0} ${r0},${y0} ${r1},${y1 + 6} ${l1},${y1 + 6}" fill="url(#gStep)"/><polygon points="${l1},${y1 + 6} ${r1},${y1 + 6} ${r1},${y1} ${l1},${y1}" fill="#8f7f62"/>`; }).join("")}
    <polygon points="150,10 252,10 230,40 150,40" fill="#cdbf9f"/><polygon points="120,10 150,10 150,60 120,70" fill="#a8977a"/>
    <path d="M150 40 q-20 -6 -40 -2" stroke="#8f7f62" stroke-width="2" fill="none"/>
    <rect y="0" width="400" height="300" fill="url(#gLight)" opacity=".35"/>
    <line x1="40" y1="300" x2="132" y2="20" stroke="#3a2114" stroke-width="9" stroke-linecap="round"/>
    ${Array.from({ length: 10 }, (_, k) => `<line x1="${52 + k * 9}" y1="${300 - k * 27}" x2="${62 + k * 9}" y2="${300 - k * 27 - 60}" stroke="#4a2b1a" stroke-width="4"/>`).join("")}
    <line x1="372" y1="240" x2="286" y2="40" stroke="#6b3d22" stroke-width="7" stroke-linecap="round"/>
    ${feet([[200, 280, 1.2], [200, 240, 1.05], [196, 200, .9], [190, 160, .8], [178, 124, .7], [160, 96, .6]])}
    <path d="M160 50 q-10 -10 -26 -12" stroke="#ff3fae" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M140 32 l-8 6 l9 4" stroke="#ff3fae" stroke-width="4" fill="none" stroke-linecap="round"/>
    ${VIG}</svg>`,
  // step 4: the red tile landing; the show room opens up ahead (no door)
  tiles: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Red tile floor at the bottom of the stairs, opening straight into the show room">${DEFS}
    <polygon points="0,0 400,0 270,80 130,80" fill="#ddd2b6"/>
    <polygon points="0,0 130,80 130,200 0,300" fill="url(#gWallL)"/><polygon points="400,0 270,80 270,200 400,300" fill="url(#gWallR)"/>
    <rect x="130" y="80" width="140" height="120" fill="#a2875f"/>
    <rect x="130" y="80" width="140" height="44" fill="#eadfc2"/>
    <rect x="146" y="84" width="28" height="40" fill="#1f8a4c"/><rect x="182" y="88" width="36" height="34" fill="#f7f4ec"/><rect x="190" y="96" width="20" height="24" fill="#2b2222"/>
    <rect x="150" y="128" width="30" height="14" fill="#f4f4f4"/><circle cx="173" cy="128" r="4" fill="#f07c1f"/>
    <rect x="186" y="130" width="34" height="14" rx="7" fill="#c8243e"/>
    <polygon points="196,170 254,170 262,192 188,192" fill="none" stroke="#2f5fd0" stroke-width="3" stroke-dasharray="8 4"/>
    <ellipse cx="200" cy="130" rx="90" ry="60" fill="url(#gLight)" opacity=".6"/>
    <polygon points="0,300 400,300 270,200 130,200" fill="#8a6a45"/>
    <polygon points="40,300 330,300 250,214 140,214" fill="#a6402e"/>
    ${Array.from({ length: 6 }, (_, r) => { const t0 = r / 6, t1 = (r + 1) / 6, y0 = 214 + t0 * 86, y1 = 214 + t1 * 86;
      const lx = t => 140 - t * 100, rx = t => 250 + t * 80;
      return Array.from({ length: 8 }, (_, c) => { const a0 = lx(t0) + (rx(t0) - lx(t0)) * c / 8, b0 = lx(t0) + (rx(t0) - lx(t0)) * (c + 1) / 8, a1 = lx(t1) + (rx(t1) - lx(t1)) * c / 8, b1 = lx(t1) + (rx(t1) - lx(t1)) * (c + 1) / 8;
        return `<polygon points="${a0 + 1},${y0 + 1} ${b0 - 1},${y0 + 1} ${b1 - 1},${y1 - 1} ${a1 + 1},${y1 - 1}" fill="${(r + c) % 2 ? "#b44a31" : "#a9432c"}"/>`; }).join(""); }).join("")}
    <polygon points="0,300 40,300 140,214 130,200 0,250" fill="#5a3a22" opacity=".5"/>
    <rect x="16" y="196" width="46" height="40" fill="#2b2b33"/><rect x="24" y="182" width="30" height="18" fill="#e85f9c"/>
    ${feet([[190, 290, 1.2], [200, 266, 1.05], [196, 244, .9], [202, 226, .8], [198, 210, .7], [200, 196, .6]])}
    ${VIG}</svg>`,
  // the show room, from above. You come in from the stairs (an opening, no door).
  room: () => `<svg viewBox="0 0 400 300" role="img" aria-label="Map of the show room from above">${DEFS}
    <rect width="400" height="300" fill="#9a7a52"/>
    ${Array.from({ length: 12 }, (_, k) => `<line x1="0" y1="${40 + k * 22}" x2="400" y2="${40 + k * 22}" stroke="#8f6f48" stroke-width="1"/>`).join("")}
    <rect x="0" y="0" width="400" height="34" fill="#efe3c4"/>
    <rect x="62" y="0" width="80" height="44" rx="2" fill="#1f8a4c"/><text x="102" y="26" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace" fill="#fff">GREEN SCREEN</text>
    <rect x="168" y="0" width="86" height="46" fill="#fbf8f1" stroke="#d9cfb6" stroke-width="2"/><rect x="188" y="10" width="46" height="32" rx="2" fill="#2b2222"/>
    <text x="211" y="60" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace" fill="#fbf2dc">FIREPLACE</text>
    <rect x="296" y="0" width="104" height="28" fill="#dccca6"/><text x="348" y="18" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace" fill="#5a4630">SHELVES</text>
    <g class="spot" data-spot="merch" tabindex="0" role="button" aria-label="Merch table">
      <rect x="92" y="62" width="80" height="42" rx="4" fill="#f7f7f7" stroke="#cfcfcf" stroke-width="2"/>
      <circle cx="158" cy="78" r="9" fill="#f07c1f"/><rect x="104" y="70" width="18" height="12" fill="#ddd"/>
      <text x="132" y="98" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace" fill="#333">TABLE</text>
    </g>
    <g class="spot" data-spot="seats" tabindex="0" role="button" aria-label="Red bean bag">
      <rect x="190" y="72" width="78" height="36" rx="18" fill="#c8243e"/><rect x="198" y="78" width="62" height="10" rx="5" fill="#e0435c" opacity=".7"/>
    </g>
    <g class="spot" data-spot="stage" tabindex="0" role="button" aria-label="Blue tape area">
      <rect x="170" y="138" width="190" height="112" fill="rgba(255,255,255,.07)"/>
      <rect x="170" y="138" width="190" height="112" fill="none" stroke="#2f6bf0" stroke-width="5" stroke-dasharray="16 6"/>
    </g>
    <path d="M0 214 L0 300 L70 300" stroke="#efe3c4" stroke-width="10" fill="none"/>
    <rect x="0" y="232" width="10" height="50" fill="#a6402e"/>
    <g transform="translate(26 256)"><rect x="-4" y="-12" width="96" height="22" rx="11" fill="#161015" opacity=".75"/><text x="44" y="3" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace" fill="#fff">⬅ FROM THE STAIRS</text></g>
    <g id="marks"></g>
  </svg>`
};

/* ---------- game ---------- */
function hud(){
  $("#stepNo").textContent = step < STEPS.length ? `Step ${step + 1} of ${STEPS.length}` : "Done!";
  $("#fill").style.width = `${Math.min(step, STEPS.length) / STEPS.length * 100}%`;
  $("#score").textContent = score;
}
function show(){
  hud();
  if (step >= STEPS.length) return finish();
  const s = STEPS[step]; wrongThisStep = false;
  $("#scene").className = "scene";
  $("#scene").innerHTML = SCENES[s.scene]() + (s.find ? "" : `<span class="you">You</span>`);
  if (s.find){ found = []; renderFind(); return; }
  $("#card").innerHTML = `<h2>${s.title}</h2><p>${s.text}</p>
    <div class="choices">${s.choices.map((c, i) => `<button class="choice" type="button" data-c="${i}"><span class="ic" aria-hidden="true">${c.ic}</span>${c.t}</button>`).join("")}</div>
    <p class="msg" id="msg" aria-live="polite"></p>`;
}
function choose(i, btn){
  const c = STEPS[step].choices[i];
  if (!c.ok){
    wrongThisStep = true; btn.classList.add("no"); btn.disabled = true;
    $("#msg").textContent = c.no;
    const sc = $("#scene"); sc.classList.remove("shake"); void sc.offsetWidth; sc.classList.add("shake");
    return;
  }
  score += wrongThisStep ? 50 : 100;
  document.querySelectorAll(".choice").forEach(b => b.disabled = true);
  $("#scene").classList.add("walk");
  setTimeout(() => { step++; show(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 600);
}
function renderFind(){
  const s = STEPS[step], next = s.find.find(f => !found.includes(f.id));
  $("#card").innerHTML = `<h2>${s.title}</h2><p>${next ? `Tap the <b>${next.t.toLowerCase()}</b> on the map.` : "You found everything!"}</p>
    <div class="find">${s.find.map(f => `<span class="${found.includes(f.id) ? "got" : f === next ? "now" : ""}">${found.includes(f.id) ? "✓ " : ""}${f.t}</span>`).join("")}</div>
    <p class="msg" id="msg" aria-live="polite"></p>
    ${next ? "" : `<div class="btns"><button class="btn" type="button" id="done">Finish</button></div>`}`;
  const marks = document.querySelector("#marks");
  if (marks) marks.innerHTML = found.map(id => { const g = document.querySelector(`[data-spot="${id}"]`).getBBox();
    return `<circle cx="${g.x + g.width / 2}" cy="${g.y + g.height / 2}" r="${Math.max(g.width, g.height) / 2 + 8}" fill="none" stroke="#f25fc4" stroke-width="4"/>`; }).join("");
}
function tapSpot(id){
  const s = STEPS[step], next = s.find.find(f => !found.includes(f.id));
  if (!next) return;
  if (id !== next.id){ $("#msg").textContent = found.includes(id) ? "You already found that one!" : `That's the ${s.find.find(f => f.id === id).t.toLowerCase()}. Find the ${next.t.toLowerCase()}!`; return; }
  found.push(id); score += 100; hud(); renderFind(); $("#msg").textContent = next.say;
}
function finish(){
  hud();
  const max = (STEPS.length - 1) * 100 + STEPS[STEPS.length - 1].find.length * 100;
  $("#scene").className = "scene";
  $("#scene").innerHTML = SCENES.room() ;
  $("#card").innerHTML = `<h2>You're ready for the show! 🎉</h2><p>Score <b>${score}</b> of ${max}${score === max ? ". Perfect! You know the way." : "."}</p>
    <ol class="steps">
      <li>Walk down the front hallway, past the stairs going up.</li>
      <li>Open the door on the left wall of the hallway (not the front door at the end).</li>
      <li>Go down the stairs (they turn at the bottom).</li>
      <li>Walk across the red tiles straight into the show room.</li>
      <li>Merch table by the fireplace · stage marked with blue tape · front seating on the red bean bag.</li>
    </ol>
    <div class="btns"><button class="btn" type="button" id="again">Play again</button><a class="btn ghost" href="./#mine">My tickets</a><a class="btn ghost" href="info.html">Show day info</a></div>`;
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (c) return choose(+c.dataset.c, c);
  const sp = e.target.closest("[data-spot]"); if (sp) return tapSpot(sp.dataset.spot);
  if (e.target.closest("#done")){ step++; show(); }
  if (e.target.closest("#again")){ step = 0; score = 0; show(); }
});
document.addEventListener("keydown", e => { const sp = e.target.closest && e.target.closest("[data-spot]"); if (sp && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tapSpot(sp.dataset.spot); } });
show();
</script>
</body>
</html>
